services:
  redis:
    image: redis:alpine
    ports:
      - 6379:6379
  db:
    image: kartoza/postgis
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: beep
      POSTGRES_PASS: beep
      POSTGRES_DBNAME: beep
      POSTGRES_MULTIPLE_EXTENSIONS: postgis
      TZ: America/New_York
  s3:
    image: rustfs/rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3-data:/data
    environment:
      RUSTFS_ACCESS_KEY: beep
      RUSTFS_SECRET_KEY: beepbeepbeep
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 10
  bucket:
    image: rustfs/rc
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        rc alias set local http://s3:9000 beep beepbeepbeep
        rc mb local/beep
        rc anonymous set public local/beep

volumes:
  db-data:
  s3-data:

